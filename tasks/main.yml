---
- name: Load distribution specific variables
  ansible.builtin.include_vars: '{{ item }}'
  failed_when: false
  loop:
    - "vars/distribution-default.yml"
    - "vars/distribution-\
      {{ ansible_distribution | lower | regex_replace(' ', '') }}\
      .yml"
    - "vars/distribution-\
      {{ ansible_distribution | lower | regex_replace(' ', '') }}\
      {{ ansible_distribution_major_version }}\
      .yml"
    - "vars/distribution-\
      {{ ansible_distribution | lower | regex_replace(' ', '') }}\
      {{ ansible_distribution_version }}\
      .yml"

- name: Set up prerequisites repositories
  ansible.builtin.import_tasks: setup_prerequisites_repos.yml
  when: epel_supported | bool

- name: Enable epel repository
  ansible.builtin.import_tasks: enable_epel.yml
  when: epel_supported | bool
