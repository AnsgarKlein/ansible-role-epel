---
driver:
  name: docker


platforms:
  - name: rockylinux8
    image: ansgarklein/moleculetest-rockylinux8:latest
    pre_build_image: true
    command: '/sbin/init'
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

  - name: rockylinux9
    image: ansgarklein/moleculetest-rockylinux9:latest
    pre_build_image: true
    command: '/sbin/init'
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

  - name: rockylinux10
    image: ansgarklein/moleculetest-rockylinux10:latest
    pre_build_image: true
    command: '/sbin/init'
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

  - name: ubuntu2604
    image: ansgarklein/moleculetest-ubuntu2604:latest
    pre_build_image: true
    command: '/sbin/init'
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true


provisioner:
  name: ansible
